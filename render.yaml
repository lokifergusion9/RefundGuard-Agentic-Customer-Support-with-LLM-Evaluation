# Render Blueprint for the one-process demo (DEPLOY.md). Databases are on Neon (free).
# Values marked `sync: false` are entered in the Render dashboard and never committed.
services:
  - type: web
    name: refundguard
    runtime: docker
    plan: free
    # Same region as the Neon project (AWS ap-southeast-1): every query crosses this link.
    region: singapore
    healthCheckPath: /health
    envVars:
      # Neon connection strings, as postgresql+psycopg://...?sslmode=require (direct, not pooled).
      - key: DATABASE_URL
        sync: false
      - key: EVAL_DATABASE_URL
        sync: false
      # Gemini free tier: a key from Google AI Studio with no billing linked.
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: AGENT_ARCHITECTURE
        value: specialist
      - key: AGENT_PROMPT_VERSION
        value: v1
      # Generated once by Render. Copy JWT_SECRET into your local .env to mint demo tokens.
      - key: JWT_SECRET
        generateValue: true
      - key: MOCK_PAYMENTS_API_KEY
        generateValue: true
      - key: MOCK_SHIPPING_API_KEY
        generateValue: true
      - key: MOCK_TICKETING_API_KEY
        generateValue: true
